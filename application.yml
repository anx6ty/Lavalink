
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:2333}

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    # Spotify tracks/albums/playlists + spsearch: (resolved to a playable mirror, see plugins.lavasrc)
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      snapshot: false

  server:
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 6
    soundcloudSearchEnabled: true

plugins:
  lavasrc:
    # Spotify only exposes metadata, so each track is mirrored to a playable source.
    # SoundCloud first because it is not bot-gated; YouTube is the fallback.
    providers:
      - "scsearch:%QUERY%"
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 10   # pages of 100 tracks
      albumLoadLimit: 6
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Clients that work without a poToken go first; WEB/MWEB need one, so they are last.
    clients:
      - ANDROID_VR
      - TVHTML5_SIMPLY
      - WEBEMBEDDED
      - MWEB
      - WEB
    # Optional but the most reliable fix on datacenter IPs. Use a THROWAWAY Google account.
    # First run: set enabled: true with no refreshToken, watch the logs for the device-login
    # URL + code, approve it, then paste the printed refresh token here and redeploy.
    oauth:
      enabled: ${YOUTUBE_OAUTH_ENABLED:false}
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: false
    # Alternative/addition: a poToken + visitorData pair (needed for WEB/MWEB).
    # pot:
    #   token: "${YOUTUBE_POT_TOKEN}"
    #   visitorData: "${YOUTUBE_VISITOR_DATA}"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: DEBUG
